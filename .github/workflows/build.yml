name: Build

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

# Ein Release-Lauf zur Zeit, sonst überschreiben sich parallele Pushes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUDI_BUILD: ${{ github.sha }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cp target/release/rudi-fm rudi-fm-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: rudi-fm-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cp target/release/rudi-fm.exe rudi-fm-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rudi-fm-windows-x86_64.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Universal binary, app bundle, DMG
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          lipo -create \
            target/aarch64-apple-darwin/release/rudi-fm \
            target/x86_64-apple-darwin/release/rudi-fm \
            -output rudi-fm-macos-universal
          chmod +x rudi-fm-macos-universal

          APP="ruDI.FM.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp rudi-fm-macos-universal "$APP/Contents/MacOS/rudi-fm"
          cp packaging/macos/launcher.sh "$APP/Contents/MacOS/rudi-fm-launcher"
          chmod +x "$APP/Contents/MacOS/rudi-fm-launcher"
          sed "s/__VERSION__/$VERSION/" packaging/macos/Info.plist.in > "$APP/Contents/Info.plist"
          echo "APPL????" > "$APP/Contents/PkgInfo"

          mkdir dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "ruDI.FM" -srcfolder dmg-root -ov -format UDZO ruDI.FM-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            rudi-fm-macos-universal
            ruDI.FM-macOS.dmg

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Rollender Tag: der Updater vergleicht den Release-Body (Commit-SHA) mit dem eingebauten Build.
      - name: Move tag
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neuester Build
          body: ${{ github.sha }}
          files: dist/*
