name: Build

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

# Ein Release-Lauf zur Zeit, sonst überschreiben sich parallele Pushes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUDI_BUILD: ${{ github.sha }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, src: target/release/rudi-fm, asset: rudi-fm-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, src: target/release/rudi-fm, asset: rudi-fm-linux-aarch64 }
          - { runner: windows-latest, src: target/release/rudi-fm.exe, asset: rudi-fm-windows-x86_64.exe }
          - { runner: windows-11-arm, src: target/release/rudi-fm.exe, asset: rudi-fm-windows-aarch64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cp ${{ matrix.src }} ${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: App bundle und DMG je Architektur
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          for pair in aarch64:aarch64-apple-darwin x86_64:x86_64-apple-darwin; do
            ARCH="${pair%%:*}"; TARGET="${pair#*:}"
            cp "target/$TARGET/release/rudi-fm" "rudi-fm-macos-$ARCH"
            chmod +x "rudi-fm-macos-$ARCH"

            APP="ruDI.FM.app"; rm -rf "$APP" dmg-root
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dmg-root
            cp "rudi-fm-macos-$ARCH" "$APP/Contents/MacOS/rudi-fm"
            cp packaging/macos/launcher.sh "$APP/Contents/MacOS/rudi-fm-launcher"
            chmod +x "$APP/Contents/MacOS/rudi-fm-launcher"
            sed "s/__VERSION__/$VERSION/" packaging/macos/Info.plist.in > "$APP/Contents/Info.plist"
            echo "APPL????" > "$APP/Contents/PkgInfo"
            cp -R "$APP" dmg-root/
            ln -s /Applications dmg-root/Applications
            hdiutil create -volname "ruDI.FM" -srcfolder dmg-root -ov -format UDZO "ruDI.FM-macOS-$ARCH.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            rudi-fm-macos-aarch64
            rudi-fm-macos-x86_64
            ruDI.FM-macOS-aarch64.dmg
            ruDI.FM-macOS-x86_64.dmg

  release:
    needs: [native, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Rollender Tag: der Updater vergleicht den Release-Body (Commit-SHA) mit dem eingebauten Build.
      - name: Move tag
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neuester Build
          body: ${{ github.sha }}
          files: dist/*
