[package]
name = "rudi-fm"
description = "ruDI.FM – schlanker Terminal-Player für DI.FM Premium"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
discord-rich-presence = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tiny_http = "0.12.0"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
